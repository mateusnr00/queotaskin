name: Expire pending reservations

# Roda a cada 5 minutos. Necessário porque o plano Hobby do Vercel só
# permite cron jobs diários, e a expiração de reservas precisa ser
# frequente pra liberar números rapidamente.
#
# O endpoint /api/cron/expire-reservations exige Authorization: Bearer
# com o CRON_SECRET (configurado tanto no Vercel quanto no GitHub).
#
# A camada de "lazy expire" em createReservation cobre o caso de alta
# atividade; este cron é o backstop pra rifas dormentes.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # permite disparar manualmente pelo painel

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call expire endpoint
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -X GET \
            "https://sorteios.vip/api/cron/expire-reservations"
